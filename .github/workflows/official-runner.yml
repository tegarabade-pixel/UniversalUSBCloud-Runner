name: Universal USB Cloud - Official Reusable Runner v2.10.20 PERSISTENT IDLE HANDOVER HD

on:
  workflow_call:
    inputs:
      pair_code:
        description: "Pair Code dari APK Universal USB Cloud"
        required: true
        type: string
      keep_alive_minutes:
        description: "Windows cloud hidup berapa menit"
        required: true
        default: "120"
        type: string
    secrets:
      # Fully custom provider path: JSON array of standard WebRTC RTCIceServer objects.
      UUC_ICE_SERVERS_JSON:
        required: false
      # Cloudflare Realtime TURN: long-lived key stays only inside Actions;
      # this workflow exchanges it for short-lived WebRTC ICE credentials.
      UUC_CF_TURN_KEY_ID:
        required: false
      UUC_CF_TURN_API_TOKEN:
        required: false
      # STUN-only provider list, comma/semicolon/space separated.
      UUC_STUN_URLS:
        required: false
      # Preferred self-hosted coturn REST credentials (minimum: HOST + SHARED_SECRET).
      UUC_COTURN_HOST:
        required: false
      UUC_COTURN_SHARED_SECRET:
        required: false
      UUC_COTURN_ENABLE_TLS:
        required: false
      UUC_COTURN_TLS_PORT:
        required: false
      # Metered TURN credential-scoped API. Configure once in repository secrets.
      # UUC_METERED_APP is the app name (for example "myapp", not a URL).
      # UUC_METERED_API_KEY is the TURN credential API key, not the account secret key.
      UUC_METERED_APP:
        required: false
      UUC_METERED_API_KEY:
        required: false
      UUC_METERED_REGION:
        required: false
      # Generic static TURN compatibility for other providers.
      UUC_TURN_URL:
        required: false
      UUC_TURN_USERNAME:
        required: false
      UUC_TURN_CREDENTIAL:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  windows-cloud:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      ROOM: ${{ inputs.pair_code }}
      KEEP: ${{ inputs.keep_alive_minutes }}
      SIGNAL_URL: wss://universal-usb-signal.reiseakari.workers.dev/ws
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout official runner source
        uses: actions/checkout@v4
        with:
          repository: tegarabade-pixel/UniversalUSBCloud-Runner
          ref: main
          path: uuc-official
          persist-credentials: false

      - name: Install latest usbip-win2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $headers = @{
            "Accept" = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "Universal-USB-Cloud"
          }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/vadimgrn/usbip-win2/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '(?i)-x64\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw "usbip-win2 x64 installer tidak ditemukan" }
          $installer = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -UseBasicParsing -Headers @{"Authorization"="Bearer $env:GH_TOKEN";"User-Agent"="Universal-USB-Cloud"} -Uri $asset.browser_download_url -OutFile $installer
          $p = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-") -PassThru
          $deadline = (Get-Date).AddSeconds(120)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep 2; $p.Refresh() }
          $usbip = @("C:\Program Files\USBip\usbip.exe","C:\Program Files (x86)\USBip\usbip.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $usbip) {
            $f = Get-ChildItem "C:\Program Files" -Filter usbip.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { $usbip = $f.FullName }
          }
          if (-not $usbip) { throw "usbip.exe tidak ditemukan setelah install" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          "USBIP_EXE=$usbip" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          Write-Host "usbip-win2: $usbip"

      - name: Prepare provider-agnostic ICE + short-lived TURN credentials
        shell: pwsh
        env:
          ICE_SERVERS_JSON_SECRET: ${{ secrets.UUC_ICE_SERVERS_JSON }}
          CF_TURN_KEY_ID_SECRET: ${{ secrets.UUC_CF_TURN_KEY_ID }}
          CF_TURN_API_TOKEN_SECRET: ${{ secrets.UUC_CF_TURN_API_TOKEN }}
          STUN_URLS_SECRET: ${{ secrets.UUC_STUN_URLS }}
          COTURN_HOST_SECRET: ${{ secrets.UUC_COTURN_HOST }}
          COTURN_SHARED_SECRET: ${{ secrets.UUC_COTURN_SHARED_SECRET }}
          COTURN_ENABLE_TLS_SECRET: ${{ secrets.UUC_COTURN_ENABLE_TLS }}
          COTURN_TLS_PORT_SECRET: ${{ secrets.UUC_COTURN_TLS_PORT }}
          METERED_APP_SECRET: ${{ secrets.UUC_METERED_APP }}
          METERED_API_KEY_SECRET: ${{ secrets.UUC_METERED_API_KEY }}
          METERED_REGION_SECRET: ${{ secrets.UUC_METERED_REGION }}
          STATIC_TURN_URL: ${{ secrets.UUC_TURN_URL }}
          STATIC_TURN_USERNAME: ${{ secrets.UUC_TURN_USERNAME }}
          STATIC_TURN_CREDENTIAL: ${{ secrets.UUC_TURN_CREDENTIAL }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $iceServers = @()
          $iceMode = "direct-only"
          $iceProvider = "none"

          function Split-IceUrls([string]$raw) {
            if ([string]::IsNullOrWhiteSpace($raw)) { return @() }
            return @($raw -split '[,;\s]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }

          # 1) Exact custom JSON wins. This is the escape hatch for any provider.
          $rawCustom = ($env:ICE_SERVERS_JSON_SECRET | Out-String).Trim()
          if ($rawCustom) {
            try {
              $parsed = $rawCustom | ConvertFrom-Json
              $iceServers = @($parsed)
              if ($iceServers.Count -lt 1) { throw "empty ICE array" }
              $iceMode = "custom-json"
              $iceProvider = "custom"
            } catch {
              throw "UUC_ICE_SERVERS_JSON is invalid JSON: $($_.Exception.Message)"
            }
          }

          # 2) Cloudflare Realtime TURN. The repository stores only the long-lived
          # TURN key id + API token as GitHub Actions secrets. This step exchanges
          # them for short-lived ICE credentials and only the short-lived result is
          # forwarded (encrypted) to Android. The API token never leaves this step.
          if ($iceServers.Count -eq 0) {
            $cfKeyId = ($env:CF_TURN_KEY_ID_SECRET | Out-String).Trim()
            $cfToken = ($env:CF_TURN_API_TOKEN_SECRET | Out-String).Trim()
            if ($cfKeyId -and $cfToken) {
              if ($cfKeyId -notmatch '^[A-Za-z0-9_-]{8,128}$') { throw "UUC_CF_TURN_KEY_ID format looks invalid" }
              $keepMinutes = 120
              $tmpKeep = 0
              if ([int]::TryParse($env:KEEP, [ref]$tmpKeep)) { $keepMinutes = [Math]::Max(1, $tmpKeep) }
              # Cloudflare permits TURN credentials up to 48 hours. Add 30 minutes
              # so a session does not expire immediately at the workflow deadline.
              $ttl = [Math]::Min(172800, [Math]::Max(3600, ($keepMinutes * 60) + 1800))
              $endpoint = "https://rtc.live.cloudflare.com/v1/turn/keys/$cfKeyId/credentials/generate-ice-servers"
              $headers = @{ "Authorization" = "Bearer $cfToken"; "Content-Type" = "application/json" }
              try {
                $body = @{ ttl = $ttl } | ConvertTo-Json -Compress
                $cf = Invoke-RestMethod -Method Post -Uri $endpoint -Headers $headers -Body $body -TimeoutSec 30
                $candidateServers = @($cf.iceServers)
                if ($candidateServers.Count -lt 1) { throw "Cloudflare returned no iceServers" }

                # aiortc 1.15 uses one TURN URI from the list per PeerConnection.
                # Keep all Cloudflare URLs in deterministic order so Android can
                # try all of them and the Windows host can rotate UDP/TCP/TLS on
                # recovery without generating new credentials.
                $normalized = @()
                foreach ($srv in $candidateServers) {
                  $urls = @($srv.urls | ForEach-Object { [string]$_ } | Where-Object { $_ })
                  # Port 53 is intentionally omitted: it can delay non-trickle ICE.
                  $urls = @($urls | Where-Object { $_ -notmatch ':(53)(\?|$)' })
                  if ($urls.Count -eq 0) { continue }
                  $item = [ordered]@{ urls = $urls }
                  if ($srv.username) { $item["username"] = [string]$srv.username }
                  if ($srv.credential) { $item["credential"] = [string]$srv.credential }
                  $normalized += $item
                }
                if ($normalized.Count -lt 1) { throw "Cloudflare ICE response became empty after validation" }
                $iceServers = $normalized
                $iceMode = "turn-ephemeral-auto"
                $iceProvider = "cloudflare-realtime"
              } finally {
                # Minimize lifetime of long-lived credentials in the PowerShell process.
                $cfToken = $null
                $env:CF_TURN_API_TOKEN_SECRET = ""
              }
            }
          }

          # 3) Self-hosted coturn REST API. Long-term secret exists only in this step.
          if ($iceServers.Count -eq 0) {
            $coturnHost = ($env:COTURN_HOST_SECRET | Out-String).Trim()
            $coturnSecret = ($env:COTURN_SHARED_SECRET | Out-String).Trim()
            if ($coturnHost -and $coturnSecret) {
              if ($coturnHost -match '://') { throw "UUC_COTURN_HOST must be a hostname only, for example turn.example.com" }
              if ($coturnHost -match '[/\s]') { throw "UUC_COTURN_HOST must not contain path or whitespace" }

              $keepMinutes = 120
              $tmpKeep = 0
              if ([int]::TryParse($env:KEEP, [ref]$tmpKeep)) { $keepMinutes = [Math]::Max(1, $tmpKeep) }
              $expires = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + [Math]::Min(86400, [Math]::Max(3600, ($keepMinutes * 60) + 1800))
              $subject = "uuc-$($env:GITHUB_RUN_ID)"
              $username = "$expires`:$subject"

              $hmac = New-Object System.Security.Cryptography.HMACSHA1
              try {
                $hmac.Key = [Text.Encoding]::UTF8.GetBytes($coturnSecret)
                $digest = $hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($username))
                $credential = [Convert]::ToBase64String($digest)
              } finally {
                $hmac.Dispose()
              }

              $turnUrls = @(
                "turn:$coturnHost`:3478?transport=udp",
                "turn:$coturnHost`:3478?transport=tcp"
              )
              $tlsEnabled = (($env:COTURN_ENABLE_TLS_SECRET | Out-String).Trim().ToLowerInvariant() -in @("1","true","yes","on"))
              if ($tlsEnabled) {
                $tlsPort = 443
                $tmpTls = 0
                if ([int]::TryParse(($env:COTURN_TLS_PORT_SECRET | Out-String).Trim(), [ref]$tmpTls) -and $tmpTls -ge 1 -and $tmpTls -le 65535) { $tlsPort = $tmpTls }
                $turnUrls += "turns:$coturnHost`:$tlsPort?transport=tcp"
              }
              $iceServers = @(
                [ordered]@{ urls = @("stun:$coturnHost`:3478") },
                [ordered]@{ urls = $turnUrls; username = $username; credential = $credential }
              )
              $iceMode = "coturn-rest-ephemeral"
              $iceProvider = "self-hosted-coturn"

              # Minimize lifetime of the long-term secret in this process.
              $coturnSecret = $null
              $env:COTURN_SHARED_SECRET = ""
            }
          }

          # 4) Metered credential API. The credential-scoped API key can safely
          # fetch the standard WebRTC iceServers array; the account secret key is
          # never needed by the runner. Create/reuse this credential once.
          if ($iceServers.Count -eq 0) {
            $meteredApp = ($env:METERED_APP_SECRET | Out-String).Trim()
            $meteredApiKey = ($env:METERED_API_KEY_SECRET | Out-String).Trim()
            $meteredRegion = ($env:METERED_REGION_SECRET | Out-String).Trim()
            if ($meteredApp -or $meteredApiKey) {
              if (-not $meteredApp -or -not $meteredApiKey) {
                throw "Metered TURN requires BOTH UUC_METERED_APP and UUC_METERED_API_KEY"
              }
              $meteredApp = $meteredApp -replace '^https?://',''
              $meteredApp = $meteredApp -replace '\.metered\.live/?$',''
              if ($meteredApp -notmatch '^[A-Za-z0-9][A-Za-z0-9-]{1,62}$') {
                throw "UUC_METERED_APP must be the app name only, for example myapp"
              }
              if ($meteredApiKey -notmatch '^[A-Za-z0-9_-]{16,256}$') {
                throw "UUC_METERED_API_KEY format looks invalid"
              }
              if ($meteredRegion -and $meteredRegion -notmatch '^[a-z_]{2,32}$') {
                throw "UUC_METERED_REGION format looks invalid"
              }
              $endpoint = "https://$meteredApp.metered.live/api/v1/turn/credentials?apiKey=$([uri]::EscapeDataString($meteredApiKey))"
              if ($meteredRegion) {
                $endpoint += "&region=$([uri]::EscapeDataString($meteredRegion))"
              }
              try {
                $meteredRaw = Invoke-RestMethod -Method Get -Uri $endpoint -TimeoutSec 30
                $normalized = @()
                foreach ($srv in @($meteredRaw)) {
                  $urls = @($srv.urls | ForEach-Object { [string]$_ } | Where-Object { $_ })
                  if ($urls.Count -eq 0 -and $srv.url) { $urls = @([string]$srv.url) }
                  if ($urls.Count -eq 0) { continue }
                  $item = [ordered]@{ urls = $urls }
                  if ($srv.username) { $item["username"] = [string]$srv.username }
                  if ($srv.credential) { $item["credential"] = [string]$srv.credential }
                  $normalized += $item
                }
                if ($normalized.Count -lt 1) { throw "Metered returned no ICE servers" }
                $meteredTurnCount = 0
                foreach ($srv in $normalized) {
                  foreach ($u in @($srv.urls)) {
                    if ([string]$u -like 'turn:*' -or [string]$u -like 'turns:*') { $meteredTurnCount++ }
                  }
                }
                if ($meteredTurnCount -lt 1) { throw "Metered returned no TURN URLs" }
                $iceServers = $normalized
                $iceMode = "metered-credential-api"
                $iceProvider = "metered"
              } finally {
                # Credential-scoped API key stays only in the workflow process.
                $meteredApiKey = $null
                $env:METERED_API_KEY_SECRET = ""
              }
            }
          }

          # 5) Generic static TURN fallback works with Twilio/coturn/LTCM/etc.
          if ($iceServers.Count -eq 0 -and $env:STATIC_TURN_URL -and $env:STATIC_TURN_USERNAME -and $env:STATIC_TURN_CREDENTIAL) {
            $turnUrls = Split-IceUrls $env:STATIC_TURN_URL
            if ($turnUrls.Count -gt 0) {
              $stunUrls = Split-IceUrls $env:STUN_URLS_SECRET
              if ($stunUrls.Count -gt 0) { $iceServers += [ordered]@{ urls = $stunUrls } }
              $iceServers += [ordered]@{ urls=$turnUrls; username=$env:STATIC_TURN_USERNAME; credential=$env:STATIC_TURN_CREDENTIAL }
              $iceMode = "static-turn"
              $iceProvider = "generic-static"
            }
          }

          # 6) STUN-only, if the operator explicitly configured one.
          if ($iceServers.Count -eq 0) {
            $stunUrls = Split-IceUrls $env:STUN_URLS_SECRET
            if ($stunUrls.Count -gt 0) {
              $iceServers = @([ordered]@{ urls = $stunUrls })
              $iceMode = "stun-only"
              $iceProvider = "custom-stun"
            }
          }

          # 7) Safe zero-config fallback: STUN only. v2.10.6 intentionally does
          # NOT claim anonymous/public TURN. A relay provider must authenticate and
          # must pass the runtime relay-candidate probe below.
          if ($iceServers.Count -eq 0) {
            $iceServers = @(
              [ordered]@{ urls = @(
                "stun:stun.l.google.com:19302",
                "stun:stun1.l.google.com:19302"
              ) }
            )
            $iceMode = "stun-only"
            $iceProvider = "uuc-zero-config-stun"
          }

          $iceJson = ConvertTo-Json -InputObject @($iceServers) -Compress -Depth 8
          $delimiter = "UUC_ICE_" + [guid]::NewGuid().ToString("N")
          "UUC_ICE_SERVERS_JSON<<$delimiter" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          $iceJson | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          $delimiter | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "UUC_ICE_MODE=$iceMode" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "UUC_ICE_PROVIDER=$iceProvider" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          # Compatibility with older host/agent status fields.
          "UUC_TURN_MODE=$iceMode" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append

          $turnCount = 0
          $stunCount = 0
          foreach ($srv in $iceServers) {
            foreach ($u in @($srv.urls)) {
              if ($u -like 'turn:*' -or $u -like 'turns:*') { $turnCount++ }
              elseif ($u -like 'stun:*' -or $u -like 'stuns:*') { $stunCount++ }
            }
          }
          Write-Host "ICE configuration: provider=$iceProvider mode=$iceMode servers=$($iceServers.Count) stunEndpoints=$stunCount turnEndpoints=$turnCount"
          if ($turnCount -eq 0) { Write-Warning "No TURN relay configured. Direct ICE may fail behind strict CGNAT/symmetric NAT." }

      - name: Prepare native WebRTC host dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          foreach ($svc in @("AudioEndpointBuilder","Audiosrv")) {
            try { Set-Service $svc -StartupType Automatic -ErrorAction SilentlyContinue } catch {}
            try { Start-Service $svc -ErrorAction SilentlyContinue } catch {}
          }
          python -m pip install --disable-pip-version-check --quiet "aiortc==1.15.0" "mss==10.2.0" "numpy>=2.0,<3" "websockets>=14,<16" "PyAudioWPatch==0.2.12.8"
          # v2.10.15 compositor-aware capture + widescreen/encoder latency tuning. Stable DXCam 0.3.0 has Windows
          # Graphics Capture (WinRT) and DXGI Desktop Duplication backends for
          # CPython 3.12. The host automatically falls back to MSS if unavailable.
          python -m pip install --disable-pip-version-check --quiet "dxcam[winrt]==0.3.0"
          # v2.10.15: aiortc 1.15.0 uses libx264 + zerolatency but leaves the
          # x264 preset at its slower default. Pin ultrafast for interactive
          # desktop latency. The exact aiortc version is pinned above, and the
          # patch fails loudly if the expected source shape ever changes.
          @'
          from pathlib import Path
          import aiortc.codecs.h264 as h264
          p = Path(h264.__file__)
          text = p.read_text(encoding="utf-8")
          if '"preset": "ultrafast"' not in text:
              needle = '"tune": "zerolatency",'
              if needle not in text:
                  raise SystemExit("aiortc H264 patch point not found")
              text = text.replace(needle, needle + '\n                "preset": "ultrafast",', 1)
          # v2.10.20: 720p text needs a little more headroom than aiortc's
          # 1 Mbps default, while congestion control can still drive bitrate down.
          text = text.replace('DEFAULT_BITRATE = 1000000  # 1 Mbps', 'DEFAULT_BITRATE = 1600000  # UUC 720p clarity baseline')
          text = text.replace('MIN_BITRATE = 500000  # 500 kbps', 'MIN_BITRATE = 600000  # UUC floor')
          p.write_text(text, encoding="utf-8")
          compile(text, str(p), "exec")
          print(f"aiortc H264 low-latency preset: OK path={p}")
          '@ | python -
          # Canonical path is desktop-host/uuc_webrtc_host.py. PATH-FIX1 also
          # recovers from the accidental truncated extension currently present in
          # some repositories: desktop-host/uuc_webrtc_host.p. The recovered file
          # is copied to RUNNER_TEMP with the canonical .py name before execution.
          $root = Join-Path $env:GITHUB_WORKSPACE "uuc-official"
          $candidates = @(
            (Join-Path $root "desktop-host\uuc_webrtc_host.py"),
            (Join-Path $root "desktop-host\uuc_webrtc_host.p"),
            (Join-Path $root "dekstop-host\uuc_webrtc_host.py"),
            (Join-Path $root "dekstop-host\uuc_webrtc_host.p")
          )
          $hostSource = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $hostSource) {
            $found = Get-ChildItem $root -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @("uuc_webrtc_host.py", "uuc_webrtc_host.p") } |
              Select-Object -First 1
            if ($found) { $hostSource = $found.FullName }
          }
          if (-not $hostSource -or -not (Test-Path $hostSource)) {
            Write-Host "Checked native-host candidates:"
            $candidates | ForEach-Object { Write-Host " - $_ exists=$(Test-Path $_)" }
            throw "Official native desktop host source missing after PATH-FIX1 search"
          }
          $hostPy = Join-Path $env:RUNNER_TEMP "uuc_webrtc_host.py"
          Copy-Item -LiteralPath $hostSource -Destination $hostPy -Force
          python -m py_compile $hostPy
          "DESKTOP_HOST_PY=$hostPy" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          Write-Host "Native WebRTC host source: OK source=$hostSource runtime=$hostPy"

      - name: Verify TURN relay allocation and select working endpoint
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $probe = Join-Path $env:RUNNER_TEMP "uuc_turn_probe_v2106.py"
          $result = Join-Path $env:RUNNER_TEMP "uuc_turn_probe_result.json"
          @'
          import asyncio, json, os
          from aiortc import RTCConfiguration, RTCIceServer, RTCPeerConnection

          def urls_of(item):
              if not isinstance(item, dict):
                  return []
              urls = item.get("urls", item.get("url", []))
              if isinstance(urls, str):
                  urls = [urls]
              return [str(x).strip() for x in (urls or []) if str(x).strip()]

          def is_turn(url):
              u = url.lower()
              return u.startswith("turn:") or u.startswith("turns:")

          def is_stun(url):
              u = url.lower()
              return u.startswith("stun:") or u.startswith("stuns:")

          def candidate_types(sdp):
              out = []
              for line in (sdp or "").splitlines():
                  if "candidate:" not in line or " typ " not in line:
                      continue
                  parts = line.strip().split()
                  try:
                      out.append(parts[parts.index("typ") + 1].lower())
                  except Exception:
                      pass
              return sorted(set(out))

          async def gather_one(url, username, credential, timeout=14):
              server = RTCIceServer(urls=[url], username=username, credential=credential)
              pc = RTCPeerConnection(RTCConfiguration(iceServers=[server]))
              pc.createDataChannel("uuc-turn-verify")
              try:
                  offer = await pc.createOffer()
                  await asyncio.wait_for(pc.setLocalDescription(offer), timeout=timeout)
                  sdp = pc.localDescription.sdp if pc.localDescription else ""
                  types = candidate_types(sdp)
                  return ("relay" in types), types, ""
              except Exception as e:
                  return False, [], f"{type(e).__name__}: {str(e)[:160]}"
              finally:
                  await pc.close()

          async def main():
              out_path = os.environ["UUC_TURN_PROBE_RESULT_FILE"]
              try:
                  items = json.loads(os.environ.get("UUC_ICE_SERVERS_JSON", "[]"))
              except Exception as e:
                  with open(out_path, "w", encoding="utf-8") as f:
                      json.dump({"ready": False, "reason": f"config-json:{e}", "stun": []}, f)
                  return

              stun_items = []
              turn_endpoints = []
              for item in items if isinstance(items, list) else []:
                  if not isinstance(item, dict):
                      continue
                  urls = urls_of(item)
                  su = [u for u in urls if is_stun(u)]
                  if su:
                      s = {"urls": su}
                      if item.get("username"): s["username"] = str(item.get("username"))
                      if item.get("credential"): s["credential"] = str(item.get("credential"))
                      stun_items.append(s)
                  for u in [x for x in urls if is_turn(x)]:
                      turn_endpoints.append({
                          "url": u,
                          "username": str(item.get("username", "")),
                          "credential": str(item.get("credential", "")),
                      })

              if not turn_endpoints:
                  with open(out_path, "w", encoding="utf-8") as f:
                      json.dump({"ready": False, "reason": "no-turn-configured", "stun": stun_items}, f)
                  print("TURN_VERIFY=NO_TURN_CONFIGURED")
                  return

              def rank(x):
                  u=x["url"].lower()
                  if u.startswith("turn:") and "transport=udp" in u: return 0
                  if u.startswith("turns:") and ":443" in u: return 1
                  if u.startswith("turn:") and ":80" in u and "transport=tcp" in u: return 2
                  if "transport=tcp" in u: return 3
                  return 4
              turn_endpoints.sort(key=rank)

              errors = []
              for ep in turn_endpoints[:4]:
                  safe = ep["url"].split("?", 1)[0]
                  print(f"TURN_VERIFY trying {safe}")
                  ok, types, err = await gather_one(ep["url"], ep["username"], ep["credential"])
                  if ok:
                      with open(out_path, "w", encoding="utf-8") as f:
                          json.dump({
                              "ready": True,
                              "reason": "relay-candidate-gathered",
                              "stun": stun_items,
                              "turn": ep,
                              "candidateTypes": types,
                          }, f)
                      print(f"TURN_VERIFY=RELAY_OK endpoint={safe} types={types}")
                      return
                  errors.append({"endpoint": safe, "types": types, "error": err})
                  print(f"TURN_VERIFY failed {safe} types={types} error={err}")

              with open(out_path, "w", encoding="utf-8") as f:
                  json.dump({
                      "ready": False,
                      "reason": "no-relay-candidate",
                      "stun": stun_items,
                      "errors": errors,
                  }, f)
              print("TURN_VERIFY=NO_RELAY_CANDIDATE")

          asyncio.run(main())
          '@ | Set-Content -Path $probe -Encoding UTF8

          $env:UUC_TURN_PROBE_RESULT_FILE = $result
          python $probe
          if (-not (Test-Path $result)) { throw "TURN verifier produced no result file" }
          $r = Get-Content $result -Raw | ConvertFrom-Json

          if ($r.ready -eq $true) {
            $verified = @()
            foreach ($s in @($r.stun)) {
              if ($s.urls) {
                $item = [ordered]@{ urls = @($s.urls) }
                if ($s.username) { $item["username"] = [string]$s.username }
                if ($s.credential) { $item["credential"] = [string]$s.credential }
                $verified += $item
              }
            }
            $turn = [ordered]@{ urls = @([string]$r.turn.url) }
            if ($r.turn.username) { $turn["username"] = [string]$r.turn.username }
            if ($r.turn.credential) { $turn["credential"] = [string]$r.turn.credential }
            $verified += $turn

            $json = ConvertTo-Json -InputObject @($verified) -Compress -Depth 8
            $delimiter = "UUC_VERIFIED_ICE_" + [guid]::NewGuid().ToString("N")
            "UUC_ICE_SERVERS_JSON<<$delimiter" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            $json | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            $delimiter | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            "UUC_TURN_RELAY_READY=1" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            "UUC_TURN_PROBE_RESULT=relay-ok" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            $verifiedMode = "$($env:UUC_ICE_MODE)-verified"
            "UUC_ICE_MODE=$verifiedMode" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            "UUC_TURN_MODE=$verifiedMode" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            Write-Host "TURN VERIFIED: actual relay candidate gathered; only the verified TURN endpoint will be advertised."
          } elseif ([string]$r.reason -eq "no-turn-configured") {
            "UUC_TURN_RELAY_READY=0" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            "UUC_TURN_PROBE_RESULT=no-turn-configured" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            Write-Host "TURN VERIFY: no TURN provider configured; keeping STUN/direct configuration."
          } else {
            $safeStun = @()
            foreach ($s in @($r.stun)) {
              if ($s.urls) {
                $safeStun += [ordered]@{ urls = @($s.urls) }
              }
            }
            if ($safeStun.Count -eq 0) {
              $safeStun = @([ordered]@{ urls = @(
                "stun:stun.l.google.com:19302",
                "stun:stun1.l.google.com:19302"
              ) })
            }
            $json = ConvertTo-Json -InputObject @($safeStun) -Compress -Depth 8
            $delimiter = "UUC_STUN_DOWNGRADE_" + [guid]::NewGuid().ToString("N")
            "UUC_ICE_SERVERS_JSON<<$delimiter" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            $json | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            $delimiter | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            "UUC_TURN_RELAY_READY=0" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            "UUC_TURN_PROBE_RESULT=$([string]$r.reason)" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            "UUC_ICE_MODE=stun-only-after-turn-probe-fail" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            "UUC_TURN_MODE=stun-only-after-turn-probe-fail" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            "UUC_ICE_PROVIDER=$($env:UUC_ICE_PROVIDER)-unverified" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            Write-Warning "TURN NOT VERIFIED ($($r.reason)). TURN URLs were removed for this run; Android will correctly report TURN=NO."
          }

      - name: Build Windows relay + USB-IP agent
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:GITHUB_WORKSPACE "uuc-official\agent"
          if (-not (Test-Path (Join-Path $source "main.go"))) { throw "Official agent source missing" }
          $r = Join-Path $env:RUNNER_TEMP "uuc-agent"
          New-Item -ItemType Directory -Path $r -Force | Out-Null
          Copy-Item (Join-Path $source "main.go") (Join-Path $r "main.go") -Force
          Copy-Item (Join-Path $source "go.mod") (Join-Path $r "go.mod") -Force
          Push-Location $r
          go mod tidy
          go build -trimpath -ldflags="-s -w" -o uuc-agent.exe .
          Pop-Location
          $exe = Join-Path $r "uuc-agent.exe"
          if (-not (Test-Path $exe)) { throw "Agent build gagal" }
          "AGENT_EXE=$exe" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          Write-Host "Windows FULL agent v2.10.20 PERSISTENT IDLE HANDOVER HD: OK"

      - name: Run FULL USB bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # v2.10.19: protect the hosted-runner infrastructure window itself, not just
          # the child PowerShell/Python consoles. The visible C:\ProgramData\GitHub\Host
          # window belongs to the GitHub hosted compute agent; closing it can sever the
          # job while GitHub's web UI still shows In progress for a short time.
          # We hide/disable-close on matching infrastructure windows only. Processes remain
          # normal and visible in Task Manager; no process-hiding tricks are used.
          try {
            Add-Type -TypeDefinition @'
          using System;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          public static class UucWindowShield {
            const int SW_HIDE = 0;
            const uint SC_CLOSE = 0xF060;
            const uint MF_BYCOMMAND = 0x00000000;
            [DllImport("kernel32.dll")] public static extern IntPtr GetConsoleWindow();
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
            [DllImport("user32.dll")] static extern IntPtr GetSystemMenu(IntPtr hWnd, bool bRevert);
            [DllImport("user32.dll")] static extern bool DeleteMenu(IntPtr hMenu, uint uPosition, uint uFlags);
            static bool Match(Process p) {
              string title = "", path = "", name = "";
              try { title = p.MainWindowTitle ?? ""; } catch {}
              try { path = p.MainModule.FileName ?? ""; } catch {}
              try { name = p.ProcessName ?? ""; } catch {}
              return title.IndexOf(@"C:\ProgramData\GitHub\Host", StringComparison.OrdinalIgnoreCase) >= 0
                  || title.IndexOf("hosted-compute-agent", StringComparison.OrdinalIgnoreCase) >= 0
                  || path.IndexOf(@"\GitHub\Host\", StringComparison.OrdinalIgnoreCase) >= 0
                  || name.IndexOf("Runner.Worker", StringComparison.OrdinalIgnoreCase) >= 0
                  || name.IndexOf("Runner.Listener", StringComparison.OrdinalIgnoreCase) >= 0
                  || name.IndexOf("hosted-compute-agent", StringComparison.OrdinalIgnoreCase) >= 0;
            }
            static void Protect(IntPtr h) {
              if (h == IntPtr.Zero) return;
              try { var menu = GetSystemMenu(h, false); if (menu != IntPtr.Zero) DeleteMenu(menu, SC_CLOSE, MF_BYCOMMAND); } catch {}
              try { ShowWindow(h, SW_HIDE); } catch {}
            }
            public static int HideInfrastructureWindows() {
              int n = 0;
              try { Protect(GetConsoleWindow()); } catch {}
              foreach (var p in Process.GetProcesses()) {
                try { if (p.MainWindowHandle != IntPtr.Zero && Match(p)) { Protect(p.MainWindowHandle); n++; } } catch {}
                finally { try { p.Dispose(); } catch {} }
              }
              return n;
            }
          }
          '@
            $shielded = [UucWindowShield]::HideInfrastructureWindows()
            Write-Host "UUC infrastructure window shield active hidden=$shielded (processes remain visible in Task Manager)."
          } catch { Write-Warning "Could not activate infrastructure window shield: $($_.Exception.Message)" }

          # Favor interactive capture/encode scheduling. Best-effort only.
          try { powercfg.exe /setactive SCHEME_MIN | Out-Null } catch {}

          if ([string]::IsNullOrWhiteSpace($env:ROOM) -or $env:ROOM.Length -lt 12) {
            throw "pair_code minimal 12 karakter"
          }

          $out = Join-Path $env:RUNNER_TEMP "uuc.out.log"
          $err = Join-Path $env:RUNNER_TEMP "uuc.err.log"
          $deskOut = Join-Path $env:RUNNER_TEMP "uuc-desktop.out.log"
          $deskErr = Join-Path $env:RUNNER_TEMP "uuc-desktop.err.log"

          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_HOST_PY) -or -not (Test-Path $env:DESKTOP_HOST_PY)) {
            throw "Native desktop host script missing"
          }

          # v2.10.11: prove which Windows session owns the capture process. A healthy
          # WebRTC pipeline can still carry a black framebuffer if the runner is in
          # Session 0 / a non-interactive desktop. Do not silently call that RDP success.
          $captureSession = (Get-Process -Id $PID).SessionId
          Write-Host "CAPTURE SESSION DIAG: user=$(whoami) powershellSession=$captureSession"
          try { quser 2>&1 | ForEach-Object { Write-Host "QUSER: $_" } } catch {}
          try {
            Get-Process explorer -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "EXPLORER: pid=$($_.Id) session=$($_.SessionId)"
            }
          } catch {}
          if ($captureSession -ne 0) {
            $sameSessionExplorer = Get-Process explorer -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $captureSession } | Select-Object -First 1
            if (-not $sameSessionExplorer) {
              try {
                Start-Process explorer.exe -ErrorAction Stop
                Start-Sleep -Seconds 2
                Write-Host "CAPTURE SESSION DIAG: explorer shell requested for session $captureSession"
              } catch { Write-Warning "Explorer shell could not be started: $($_.Exception.Message)" }
            }
          } else {
            Write-Warning "CAPTURE SESSION DIAG: process is in Session 0; Windows interactive desktop capture may legitimately be black."
          }
          try {
            Get-CimInstance Win32_VideoController | ForEach-Object {
              Write-Host "VIDEO: $($_.Name) current=$($_.CurrentHorizontalResolution)x$($_.CurrentVerticalResolution) status=$($_.Status)"
            }
          } catch {}

          # v2.10.16 keeps the v2.10.15 wide desktop geometry the operator normally
          # uses in Windows App. Hosted display drivers may reject unusual modes,
          # so this is best-effort: exact 1644x768 first, then nearest advertised
          # wide mode. The actual mode is exported to the host diagnostics.
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class UucDisplayMode {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields;
              public int dmPositionX, dmPositionY;
              public int dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll", CharSet=CharSet.Ansi)] static extern bool EnumDisplaySettings(string deviceName, int modeNum, ref DEVMODE devMode);
            [DllImport("user32.dll", CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettings(ref DEVMODE devMode, int flags);
            const int ENUM_CURRENT_SETTINGS = -1;
            const int DM_PELSWIDTH = 0x80000, DM_PELSHEIGHT = 0x100000;
            static DEVMODE Fresh() { var d = new DEVMODE(); d.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE)); return d; }
            public static string Current() { var d=Fresh(); return EnumDisplaySettings(null, ENUM_CURRENT_SETTINGS, ref d) ? $"{d.dmPelsWidth}x{d.dmPelsHeight}@{d.dmDisplayFrequency}" : "unknown"; }
            static int Apply(int w, int h) {
              DEVMODE chosen=Fresh(); bool found=false; int bestHz=-1;
              for(int i=0;;i++){ var m=Fresh(); if(!EnumDisplaySettings(null,i,ref m)) break; if(m.dmPelsWidth==w && m.dmPelsHeight==h && m.dmDisplayFrequency>=bestHz){ chosen=m; bestHz=m.dmDisplayFrequency; found=true; } }
              if(!found){ chosen=Fresh(); if(!EnumDisplaySettings(null, ENUM_CURRENT_SETTINGS, ref chosen)) return -999; chosen.dmPelsWidth=w; chosen.dmPelsHeight=h; chosen.dmFields |= DM_PELSWIDTH|DM_PELSHEIGHT; }
              return ChangeDisplaySettings(ref chosen, 0);
            }
            public static string SetBest(int targetW, int targetH) {
              int exact=Apply(targetW,targetH); if(exact==0) return $"exact:{Current()}";
              double targetAspect=(double)targetW/targetH; int bestW=0,bestH=0; double best=1e30;
              for(int i=0;;i++){ var d=Fresh(); if(!EnumDisplaySettings(null,i,ref d)) break; if(d.dmPelsWidth<1280 || d.dmPelsHeight<720) continue; double aspect=(double)d.dmPelsWidth/d.dmPelsHeight; double score=Math.Abs(aspect-targetAspect)*100000.0 + Math.Abs(d.dmPelsWidth-targetW)*2.0 + Math.Abs(d.dmPelsHeight-targetH); if(score<best){best=score;bestW=d.dmPelsWidth;bestH=d.dmPelsHeight;} }
              if(bestW>0){ int r=Apply(bestW,bestH); return $"fallback:{bestW}x{bestH}:result={r}:actual={Current()}"; }
              return $"unchanged:exactResult={exact}:actual={Current()}";
            }
          }
          '@
          $requestedDesktopW = 1644
          $requestedDesktopH = 768
          try {
            $modeResult = [UucDisplayMode]::SetBest($requestedDesktopW, $requestedDesktopH)
            Write-Host "UUC DESKTOP MODE: requested=$requestedDesktopW`x$requestedDesktopH result=$modeResult"
          } catch {
            Write-Warning "UUC desktop mode request failed: $($_.Exception.Message)"
          }
          $env:UUC_DESKTOP_OS_WIDTH = [string]$requestedDesktopW
          $env:UUC_DESKTOP_OS_HEIGHT = [string]$requestedDesktopH

          function Start-NativeDesktopHost {
            $env:UUC_DESKTOP_WIDTH = "1280"
            $env:UUC_DESKTOP_HEIGHT = "720"
            $env:UUC_DESKTOP_FPS = "30"
            $env:UUC_DESKTOP_AUDIO = "0"
            $env:UUC_DESKTOP_IPC_PORT = "8765"
            # Client-side pointer ownership: WinRT must not composite the Windows cursor
            # into video frames or Android would show a delayed second pointer.
            $env:DXCAM_WINRT_CURSOR_CAPTURE = "0"
            $env:DXCAM_WINRT_BORDER_REQUIRED = "0"
            $env:DXCAM_WINRT_FRAME_WAIT_MS = "0"
            $env:DXCAM_WINRT_MIN_UPDATE_INTERVAL_MS = "0"
            $env:DXCAM_WINRT_FRAME_POOL_SIZE = "2"

            $pythonExe = (Get-Command python -ErrorAction Stop).Source
            $pythonw = Join-Path (Split-Path $pythonExe -Parent) "pythonw.exe"
            $hostInterpreter = if (Test-Path $pythonw) { $pythonw } else { $pythonExe }
            $p = Start-Process -FilePath $hostInterpreter -ArgumentList @($env:DESKTOP_HOST_PY) `
              -WindowStyle Hidden -RedirectStandardOutput $deskOut -RedirectStandardError $deskErr -PassThru

            $deadline = (Get-Date).AddSeconds(25)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 350
              $p.Refresh()
              if ($p.HasExited) { break }
              try {
                $tcp = New-Object Net.Sockets.TcpClient
                $ar = $tcp.BeginConnect("127.0.0.1",8765,$null,$null)
                if ($ar.AsyncWaitHandle.WaitOne(600) -and $tcp.Connected) { $ready = $true }
                $tcp.Close()
              } catch {}
              if ($ready) { break }
            }
            if (-not $ready) {
              Get-Content $deskOut -Tail 200 -ErrorAction SilentlyContinue
              Get-Content $deskErr -Tail 200 -ErrorAction SilentlyContinue
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
              throw "Native WebRTC desktop host failed runtime health check"
            }
            try { (Get-Process -Id $p.Id -ErrorAction Stop).PriorityClass = "High" } catch {}
            Write-Host "NATIVE DESKTOP HOST READY pid=$($p.Id) ws://127.0.0.1:8765 priority=High hidden=yes"
            return $p
          }

          # Host and relay now share the same long-running step lifetime.
          $deskProc = Start-NativeDesktopHost
          $env:DESKTOP_NATIVE_READY = "1"

          $roomNormalized = ($env:ROOM -replace '-', '').ToUpperInvariant()
          $agentArgs = @("-signal",$env:SIGNAL_URL,"-room",$roomNormalized)

          function Start-UucRelayAgent {
            $p = Start-Process `
              -FilePath $env:AGENT_EXE `
              -ArgumentList $agentArgs `
              -WindowStyle Hidden `
              -RedirectStandardOutput $out `
              -RedirectStandardError $err `
              -PassThru
            Start-Sleep 3
            $p.Refresh()
            if ($p.HasExited) {
              Get-Content $out -ErrorAction SilentlyContinue
              Get-Content $err -ErrorAction SilentlyContinue
              throw "Agent langsung mati"
            }
            try { (Get-Process -Id $p.Id -ErrorAction Stop).PriorityClass = "AboveNormal" } catch {}
            Write-Host "UUC RELAY AGENT READY pid=$($p.Id) priority=AboveNormal hidden=yes"
            return $p
          }

          $proc = Start-UucRelayAgent

          Write-Host "========================================"
          Write-Host " FULL CLOUD USB + NATIVE WEBRTC READY"
          Write-Host " Pair Code sama dengan APK"
          Write-Host " APK otomatis connect ke relay"
          Write-Host " APK -> approve runner -> connect USB"
          Write-Host "========================================"

          $attached = $false
          $attachedKey = $null
          $attachedPort = $null
          $lastSeenKey = $null
          $transition = 0
          $lastVerboseStatusAt = [DateTime]::MinValue
          $lastWindowShieldAt = [DateTime]::MinValue

          # Explicit hotplug verifier: PASS only after PRESENT -> ABSENT -> PRESENT.
          $presenceState = "UNKNOWN"
          $seenPresent = $false
          $seenAbsentAfterPresent = $false
          $hotplugPass = $false
          $stateHistory = New-Object System.Collections.Generic.List[string]

          function Record-PresenceState([string]$NewState,[string]$Reason) {
            if ($NewState -eq $script:presenceState) { return }
            $oldState = $script:presenceState
            $script:presenceState = $NewState
            $stamp = Get-Date -Format "HH:mm:ss.fff"
            $entry = "$stamp $oldState -> $NewState ($Reason)"
            $script:stateHistory.Add($entry)
            Write-Host ""
            Write-Host "################################################"
            Write-Host " REMOTE STATE CHANGE: $oldState -> $NewState"
            Write-Host " Reason: $Reason"
            Write-Host "################################################"
            if ($NewState -eq "PRESENT") {
              if (-not $script:seenPresent) {
                $script:seenPresent = $true
              } elseif ($script:seenAbsentAfterPresent -and -not $script:hotplugPass) {
                $script:hotplugPass = $true
                Write-Host ""
                Write-Host "================================================"
                Write-Host " HOTPLUG PASS: PRESENT -> ABSENT -> PRESENT"
                Write-Host "================================================"
              }
            } elseif ($NewState -eq "ABSENT" -and $script:seenPresent) {
              $script:seenAbsentAfterPresent = $true
            }
          }

          function Get-RemoteUsbState {
            $listText = (& "$env:USBIP_EXE" list -r 127.0.0.1 2>&1 | Out-String)
            $m = [regex]::Match(
              $listText,
              '(?im)^\s*([0-9]+-[0-9]+(?:\.[0-9]+)*)\s*:.*?\(([0-9a-f]{4}):([0-9a-f]{4})\)'
            )

            if (-not $m.Success) {
              return [pscustomobject]@{
                Present = $false
                BusId = $null
                Vid = $null
                Pid = $null
                Key = $null
                Raw = $listText
              }
            }

            $bus = $m.Groups[1].Value
            $vid = $m.Groups[2].Value.ToLowerInvariant()
            $usbPid = $m.Groups[3].Value.ToLowerInvariant()

            return [pscustomobject]@{
              Present = $true
              BusId = $bus
              Vid = $vid
              Pid = $usbPid
              Key = "$bus|$vid`:$usbPid"
              Raw = $listText
            }
          }

          function Get-UsbIpPortState {
            $portText = (& "$env:USBIP_EXE" port 2>&1 | Out-String)
            $m = [regex]::Match($portText,'(?im)^Port\s+([0-9]+):\s+device in use')

            return [pscustomobject]@{
              Active = $m.Success
              Port = if ($m.Success) { [int]$m.Groups[1].Value } else { $null }
              Raw = $portText
            }
          }

          function Detach-UsbIpPort([string]$Reason) {
            $portState = Get-UsbIpPortState

            Write-Host ""
            Write-Host "========================================"
            Write-Host " USB/IP DETACH"
            Write-Host " Reason: $Reason"
            Write-Host "========================================"

            if ($portState.Active) {
              & "$env:USBIP_EXE" detach -p $portState.Port
              Write-Host "detach exit code: $LASTEXITCODE"
            }
            else {
              & "$env:USBIP_EXE" detach --all
              Write-Host "detach --all exit code: $LASTEXITCODE"
            }

            Start-Sleep 2
            pnputil.exe /scan-devices | Out-Host

            $script:attached = $false
            $script:attachedKey = $null
            $script:attachedPort = $null
          }

          function Show-UsbPnP([string]$Title) {
            Write-Host ""
            Write-Host "--- $Title ---"

            Get-PnpDevice -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Class -match 'USB|WPD|DiskDrive|Ports|AndroidUsbDeviceClass' -or
                $_.InstanceId -match 'USBIP|VID_'
              } |
              Select-Object Status,Class,FriendlyName,InstanceId,Problem |
              Sort-Object Class,FriendlyName |
              Format-Table -AutoSize

            Write-Host "`n--- Problem devices ---"
            pnputil.exe /enum-devices /problem /deviceids /drivers /services /stack
          }

          function Prepare-MtpDriverIfNeeded([string]$UsbVid,[string]$UsbPid) {
            if ($UsbVid -ne '2d95' -or $UsbPid -ne '6002') { return }

            $wpdSvc = Get-Service WPDBusEnum -ErrorAction SilentlyContinue
            if ($wpdSvc) {
              try {
                Set-Service WPDBusEnum -StartupType Manual -ErrorAction SilentlyContinue
                Start-Service WPDBusEnum -ErrorAction SilentlyContinue
              } catch {}
            }

            $mtpCandidates = @()
            $inboxMtp = Join-Path $env:WINDIR 'INF\wpdmtp.inf'
            if (Test-Path $inboxMtp) { $mtpCandidates += $inboxMtp }

            $repoMtps = Get-ChildItem `
              "$env:WINDIR\System32\DriverStore\FileRepository" `
              -Filter wpdmtp.inf `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            if ($repoMtps) { $mtpCandidates += $repoMtps }

            foreach ($mtpInf in @($mtpCandidates | Select-Object -Unique)) {
              & pnputil.exe /add-driver "$mtpInf" /install | Out-Host
            }
          }

          function Attach-RemoteUsb($remote) {
            Write-Host ""
            Write-Host "========================================"
            Write-Host " USB/IP ATTACH"
            Write-Host " Remote: $($remote.Key)"
            Write-Host "========================================"

            Prepare-MtpDriverIfNeeded $remote.Vid $remote.Pid

            $attachText = (
              & "$env:USBIP_EXE" attach -r 127.0.0.1 -b $remote.BusId 2>&1 |
              Out-String
            )
            $attachExit = $LASTEXITCODE

            Write-Host $attachText
            Write-Host "usbip attach exit code: $attachExit"

            if ($attachExit -ne 0 -and
                $attachText -notmatch '(?i)successfully attached|attached successfully') {
              Write-Warning "Attach gagal; akan dicoba lagi."
              return $false
            }

            Start-Sleep 3
            pnputil.exe /scan-devices | Out-Host
            Start-Sleep 3

            $portState = Get-UsbIpPortState
            $script:attached = $true
            $script:attachedKey = $remote.Key
            $script:attachedPort = $portState.Port

            Write-Host ""
            Write-Host "========================================"
            Write-Host " USB ATTACHED TO WINDOWS"
            Write-Host " Key : $($remote.Key)"
            Write-Host " Port: $($script:attachedPort)"
            Write-Host "========================================"

            Show-UsbPnP "PnP after attach $($remote.Key)"
            return $true
          }

          $end = (Get-Date).AddMinutes([int]$env:KEEP)

          while ((Get-Date) -lt $end) {
            $loopNow = Get-Date
            if (($loopNow - $lastWindowShieldAt).TotalSeconds -ge 3) {
              try { [void][UucWindowShield]::HideInfrastructureWindows() } catch {}
              $lastWindowShieldAt = $loopNow
            }
            if ($proc.HasExited) {
              Write-Warning "Relay agent stopped; restarting it without ending the Windows desktop session"
              Get-Content $out -Tail 120 -ErrorAction SilentlyContinue
              Get-Content $err -Tail 120 -ErrorAction SilentlyContinue
              Start-Sleep 1
              $proc = Start-UucRelayAgent
            }

            $deskProc.Refresh()
            if ($deskProc.HasExited) {
              Write-Warning "Native desktop host stopped; restarting in the same runtime step"
              Get-Content $deskOut -Tail 200 -ErrorAction SilentlyContinue
              Get-Content $deskErr -Tail 200 -ErrorAction SilentlyContinue
              $deskProc = Start-NativeDesktopHost
            }

            $remote = Get-RemoteUsbState
            $portState = Get-UsbIpPortState

            if ($attached -and -not $portState.Active) {
              Write-Host "USB/IP port vanished -> treating as DETACH"
              Record-PresenceState "ABSENT" "USB/IP imported port vanished"
              $attached = $false
              $attachedKey = $null
              $attachedPort = $null
            }

            if (-not $remote.Present) {
              Record-PresenceState "ABSENT" "usbip DEVLIST reports no Android USB"
              if ($attached -or $portState.Active) {
                $transition++
                Detach-UsbIpPort "Android physical USB disappeared (transition #$transition)"
              }

              if ($lastSeenKey -ne $null) {
                Write-Host "HOTPLUG: device disappeared: $lastSeenKey"
                $lastSeenKey = $null
                Show-UsbPnP "PnP after physical detach"
              }

              Write-Host "WAITING FOR ANDROID USB..."
            }
            else {
              Record-PresenceState "PRESENT" "usbip DEVLIST reports $($remote.Key)"
              if ($lastSeenKey -ne $remote.Key) {
                $transition++

                Write-Host ""
                Write-Host "========================================"
                Write-Host " HOTPLUG / RE-ENUMERATION #$transition"
                Write-Host " Previous: $lastSeenKey"
                Write-Host " Current : $($remote.Key)"
                Write-Host "========================================"

                if ($attached -or $portState.Active) {
                  Detach-UsbIpPort "USB identity changed: $attachedKey -> $($remote.Key)"
                }

                $lastSeenKey = $remote.Key
              }

              if ($attached -and $attachedKey -ne $remote.Key) {
                Detach-UsbIpPort "Attached identity no longer matches exported identity"
              }

              if (-not $attached) {
                [void](Attach-RemoteUsb $remote)
              }
            }

            # GitHub log I/O and repeated Get-Content tails were running every second.
            # Keep hotplug/liveness polling responsive but emit diagnostics only every 5s
            # so the capture/encode process gets more CPU time when browsers are busy.
            if (($loopNow - $lastVerboseStatusAt).TotalSeconds -ge 5) {
              Write-Host ""
              Write-Host "=== $(Get-Date -Format o) ==="
              Write-Host "Remote present : $($remote.Present)"
              Write-Host "Remote key     : $($remote.Key)"
              Write-Host "Attached       : $attached"
              Write-Host "Attached key   : $attachedKey"
              Write-Host "Attached port  : $attachedPort"
              Write-Host "Transitions    : $transition"
              Write-Host "Presence state : $presenceState"
              Write-Host "Hotplug PASS   : $hotplugPass"
              Write-Host "State history  :"
              if ($stateHistory.Count -eq 0) {
                Write-Host "  (none yet)"
              } else {
                $stateHistory | Select-Object -Last 8 | ForEach-Object { Write-Host "  $_" }
              }

              Get-Content $out -Tail 50 -ErrorAction SilentlyContinue
              Get-Content $err -Tail 40 -ErrorAction SilentlyContinue
              Get-Content $deskOut -Tail 20 -ErrorAction SilentlyContinue
              Get-Content $deskErr -Tail 20 -ErrorAction SilentlyContinue
              $lastVerboseStatusAt = $loopNow
            }

            Start-Sleep -Milliseconds 750
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $deskProc.Id -Force -ErrorAction SilentlyContinue
